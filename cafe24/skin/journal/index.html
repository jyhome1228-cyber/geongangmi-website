<section class="gm-section">
  <div class="gm-container gm-section-head">
    <div><span class="gm-eyebrow">GEONGANGMI JOURNAL</span><h1 class="gm-display">몸을 이해하는 기준을<br>천천히 기록합니다.</h1></div>
    <p class="gm-lead">관리 전후에 알아두면 좋은 몸의 흐름, 순환, 피부와 일상의 이야기를 건강미의 언어로 정리합니다.</p>
  </div>
</section>

<section class="gm-section gm-section--soft">
  <div class="gm-container" module="board_listpackage_5">
    <!-- 자유게시판(board_no=5)을 건강미 저널로 사용하도록 관리자에서 게시판명을 변경합니다. -->
    <div class="gm-journal-list" module="board_list_5">
      <!--
        $count = 12
        $main_list = yes
        $subject_cut = 60
        $main_list_reply_view = no
      -->
      <a class="gm-journal-row" href="/board/free/read.html{$param_read}"><span class="gm-journal-subject">{$subject}</span><span class="gm-journal-date">{$write_date|date:Y.m.d}</span></a>
      <a class="gm-journal-row" href="/board/free/read.html{$param_read}"><span class="gm-journal-subject">{$subject}</span><span class="gm-journal-date">{$write_date|date:Y.m.d}</span></a>
      <a class="gm-journal-row" href="/board/free/read.html{$param_read}"><span class="gm-journal-subject">{$subject}</span><span class="gm-journal-date">{$write_date|date:Y.m.d}</span></a>
      <a class="gm-journal-row" href="/board/free/read.html{$param_read}"><span class="gm-journal-subject">{$subject}</span><span class="gm-journal-date">{$write_date|date:Y.m.d}</span></a>
    </div>
    <p style="margin-top:32px"><a class="gm-text-link" href="/board/free/list.html?board_no=5">저널 전체보기 <span>→</span></a></p>
  </div>
